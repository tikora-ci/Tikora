
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organisateurs | TIKORA</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #f6f6f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #292929;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: .12em;
    }

    header span {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      margin-right: 8px;
      border-radius: 6px;
      background: white;
      color: black;
    }

    main {
      width: min(650px, 92%);
      margin: 40px auto;
    }

    .muted { color: #aaa; }

    form {
      padding: 24px;
      border: 1px solid #292929;
      border-radius: 16px;
      background: #111;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: .9rem;
      font-weight: 650;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #383838;
      border-radius: 8px;
      background: #080808;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font: inherit;
      font-weight: 800;
    }

    .notice {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #383838;
      border-radius: 8px;
      color: #bbb;
      font-size: .88rem;
    }
  </style>
</head>
<body>
  <header><span>T</span>TIKORA</header>

  <main>
    
    <section id="authSection">
      <h2>Ton espace organisateur</h2>
      <p class="muted">Crée ton compte ou connecte-toi pour continuer.</p>

      <form id="authForm">
        <label for="authEmail">Adresse e-mail</label>
        <input id="authEmail" type="email" autocomplete="email"
          placeholder="toi@exemple.com" required>

        <label for="authPassword">Mot de passe</label>
        <input id="authPassword" type="password"
          autocomplete="current-password" minlength="6"
          placeholder="6 caractères minimum" required>

        <button type="submit" id="loginButton">Se connecter</button>
        <button type="button" id="signupButton">Créer mon compte</button>

        <p id="authMessage" class="notice" role="status">
          Inscris-toi ou connecte-toi pour accéder à ton espace.
        </p>
      </form>
    </section>

    <h1>Publier un événement</h1>
    <p class="muted">
      Prépare ton événement et partage-le avec le public.
    </p>

    <form id="eventForm">
      <label for="title">Nom de l’événement *</label>
      <input id="title" required
        placeholder="Ex. Concert de musique">

      <label for="description">Description *</label>
      <textarea id="description" required
        placeholder="Présente ton événement"></textarea>

      <label for="location">Lieu *</label>
      <input id="location" required
        placeholder="Ex. Abidjan, Côte d’Ivoire">

      <label for="event_date">Date et heure *</label>
      <input id="event_date" type="datetime-local" required>

      <label for="ticket_price">Prix du ticket (FCFA) *</label>
      <input id="ticket_price" type="number" min="0" required
        placeholder="Ex. 5000">

      <label for="poster_url">Lien de l’affiche (facultatif)</label>
      <input id="poster_url" type="url"
        placeholder="https://...">

      <button type="submit">Préparer mon événement</button>

      <div class="notice" id="notice" role="status">
        Formulaire de démonstration : aucun événement n’est encore publié.
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://drgrpsaesdvicryppqvz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_CWZMH5J20YutMOo3Ry3ygQ_k4bt658E";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const authForm = document.getElementById("authForm");
  const authMessage = document.getElementById("authMessage");
  const signupButton = document.getElementById("signupButton");

  signupButton.addEventListener("click", async function() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;

    if (!email || !password) {
      authMessage.textContent = "Renseigne ton e-mail et ton mot de passe.";
      return;
    }

    authMessage.textContent = "Création du compte en cours...";

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      authMessage.textContent = "Erreur : " + error.message;
      return;
    }

    authMessage.textContent = data.session
      ? "Compte créé et connecté !"
      : "Compte créé. Vérifie tes e-mails pour confirmer ton adresse.";
  });

  authForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;

    authMessage.textContent = "Connexion en cours...";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    authMessage.textContent = error
      ? "Erreur : " + error.message
      : "Connexion réussie ! Ton espace organisateur est connecté.";
  });

  document.getElementById("eventForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("notice").textContent =
      "La connexion est préparée. La publication des événements sera activée à l'étape suivante.";
  });
</script>
</body>
</html>
